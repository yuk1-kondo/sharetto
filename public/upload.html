<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdfdfd">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <title>送信 - シェアっと</title>
  <script>
    (function () {
      var sid = new URLSearchParams(location.search).get('session');
      if (sid && sid.length >= 6) document.documentElement.classList.add('qr-session');
    })();
  </script>
  <link rel="stylesheet" href="css/design-tokens.css?v=20261102c">
  <link rel="stylesheet" href="css/sharetto-app.css?v=20261102c">
  <script type="module" src="./js/i18n.js"></script>
</head>
<body class="sharetto-app">
  <div class="page-language"><div class="language-switch" role="group" aria-label="Language"><button type="button" data-language="ja" lang="ja" aria-label="日本語" aria-pressed="false">JP</button><span aria-hidden="true">/</span><button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button></div></div>
  <!-- 認証オーバーレイ -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-container">
      <h2 class="auth-title">シェアっと</h2>
      <p class="auth-subtitle">6桁の参加コードを入力してください</p>
      <input type="text" inputmode="numeric" id="authInput" class="auth-input join-input" placeholder="例: 123456" maxlength="64" autocomplete="off" />
      <a href="/join.html" class="auth-button btn--ghost btn--block">参加専用ページへ</a>
      <button type="button" onclick="submitJoinCode()" class="auth-button btn--block">参加する</button>
      <div id="authError" class="auth-error">参加コードが正しくありません</div>
      <div class="auth-info">QRコードからアクセスした場合は自動認証されます</div>
    </div>
  </div>

  <div id="mainContent" class="mobile-shell">
    <div class="mobile-status-bar">
      <div class="connection-panel">
        <span id="mobileConnectionBadge" class="connection-badge" data-state="idle">準備中</span>
        <span id="mobileConnectionDetail" class="connection-detail"></span>
      </div>
      <div id="connection-visual-mobile" class="connection-visual connection-visual--compact" aria-hidden="true"></div>
      <button type="button" id="fallbackRelayBtn" class="btn btn-primary btn--block" hidden>サーバー経由に切り替え</button>
      <a href="/">← PC画面へ戻る</a>
    </div>

    <header class="mobile-page-header">
      <h1>送信</h1>
      <p>写真・動画・ファイルをPCへ送る</p>
    </header>

    <div class="panel-card">
      <!-- ファイルアップロードタブ -->
      <div class="tab-content active" id="file-tab">
        <div class="upload-area" id="upload-area" role="button" tabindex="0" aria-label="ファイル・写真を選ぶ">
          <span class="section-index">SELECT / DROP</span>
          <p>タップしてファイルを選択<br>または<br>ファイルをドラッグ＆ドロップ</p>
          <input type="file" id="file-input" class="file-input" accept="image/*,video/*,*/*" multiple>
        </div>
        
        <div class="file-preview" id="file-preview">
          <div class="file-name" id="file-name"></div>
          <div class="file-size" id="file-size"></div>
        </div>
        
        <div class="progress-container" id="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-bar"></div>
          </div>
        </div>
        
        <button class="btn btn-primary btn-sticky" id="upload-btn" disabled>アップロード</button>
        
        <div class="status" id="status"></div>
      </div>
      
    </div>

    <div class="panel-card card" id="mobileReceivePanel" hidden>
      <h3 class="card__title">PCから受信</h3>
      <div id="mobileReceiveList" class="files-list photo-gallery">
        <div class="no-files">PCから届いたファイル・テキストがここに表示されます</div>
      </div>
    </div>

    <section class="notes-section" aria-labelledby="mobileNotesTitle">
      <div class="notes-heading"><p class="section-index">TEXT &amp; LINKS</p><h2 id="mobileNotesTitle">文章・URL</h2></div>
      <div class="composer"><label for="text-input" class="sr-only">文章・URLを送る</label><div class="input-row"><textarea id="text-input" rows="2" placeholder="文章やURLを貼り付け…"></textarea><button id="text-send-btn" class="text-button" type="button">送信</button></div><p class="composer-hint muted">文章もリンクも、この欄から。</p></div>
      <div id="mobileMessageList" class="messages-list" aria-label="受信した文章とURL"><p class="no-files">届いた文章やURLが、ここに並びます。</p></div>
    </section>

    <footer class="app-footer">シェアっと · Develop by YUKI KONDO</footer>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle"><div class="modal-content"><div class="modal-header"><h2 id="modalTitle">画像プレビュー</h2><button type="button" class="text-button underlined" onclick="closeImageModal()">閉じる</button></div><img id="modalImage" class="modal-image" alt=""><button type="button" class="text-button underlined" onclick="downloadModalImage()">この写真を保存</button></div></dialog>
  <script type="module" src="./js/pages/mobile-upload.js"></script>
</body>
</html>
